codecov:
  require_ci_to_pass: true
  max_report_age: false

coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default:
        target: auto       
        threshold: 1%
        informational: false
    patch:
      default:
        target: 80%
        informational: false

flags:
  domain:
    paths:
      - ClinicFlow.Domain/
  application:
    paths:
      - ClinicFlow.Application/

ignore:
  - "ClinicFlow.Domain.Tests/**"
  - "ClinicFlow.Application.Tests/**"
  - "ClinicFlow.Infrastructure.Tests/**"
  - "ClinicFlow.Architecture.Tests/**"
  
comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false